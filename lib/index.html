<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>@t128n/skills</title>
        <meta
            name="description"
            content="Agent Skills Discovery v0.2.0 directory and index."
        />
        <link rel="stylesheet" href="open.css" />
        <link rel="stylesheet" href="site.css" />
    </head>
    <body>
        <a class="skip-link" href="#main-content">Skip to content</a>
        <header>
            <a class="header-wordmark" href="https://t128n.dev" aria-label="t128n.dev">
                <svg viewBox="0 0 18 5" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
                    <!-- shadows -->
                    <g fill-opacity="0.22">
                        <rect x="1" y="3" width="2" height="1" />
                        <rect x="8" y="3" width="2" height="1" />
                        <rect x="12" y="3" width="1" height="1" />
                        <rect x="16" y="3" width="1" height="2" />
                    </g>
                    <!-- t -->
                    <rect x="0" y="0" width="1" height="5" />
                    <rect x="0" y="1" width="3" height="1" />
                    <rect x="0" y="4" width="3" height="1" />
                    <!-- 1 -->
                    <rect x="4" y="0" width="1" height="1" />
                    <rect x="5" y="0" width="1" height="5" />
                    <!-- 2 -->
                    <rect x="7" y="0" width="3" height="1" />
                    <rect x="9" y="1" width="1" height="1" />
                    <rect x="7" y="2" width="3" height="1" />
                    <rect x="7" y="3" width="1" height="1" />
                    <rect x="7" y="4" width="3" height="1" />
                    <!-- 8 -->
                    <rect x="11" y="0" width="3" height="1" />
                    <rect x="11" y="2" width="3" height="1" />
                    <rect x="11" y="4" width="3" height="1" />
                    <rect x="11" y="0" width="1" height="5" />
                    <rect x="13" y="0" width="1" height="5" />
                    <!-- n -->
                    <rect x="15" y="1" width="3" height="1" />
                    <rect x="15" y="1" width="1" height="4" />
                    <rect x="17" y="1" width="1" height="4" />
                </svg>
            </a>
            <nav aria-label="Resources">
                <ul>
                    <li><a href="{{INDEX_URL}}">index.json</a></li>
                    <li><a href="https://github.com/t128n/skills">source</a></li>
                </ul>
            </nav>
            <a href="https://github.com/t128n/skills/issues">issues</a>
        </header>
        <main id="main-content" tabindex="-1">
            <h1>skills</h1>
            <p>
                <code>@t128n/skills</code> curated skill pack. install with
                <code>npx skills add {{PUBLIC_URL}} -g</code>.
            </p>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Skill</th>
                        <th scope="col">Description</th>
                    </tr>
                </thead>
                <tbody>
                    {{SKILLS}}
                </tbody>
            </table>
        </main>
        <footer>
            <p>© {{YEAR}} Torben Haack · @t128n/skills</p>
        </footer>
    </body>
</html>
