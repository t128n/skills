name: Build and deploy skills index

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skills.config.json"
      - "skills.lock.json"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun run build
      # actions/upload-pages-artifact >= v4 drops dotfiles such as .well-known,
      # so package the dist/ directory by hand and upload it under the name Pages expects.
      - name: Package site (keeps .well-known)
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
